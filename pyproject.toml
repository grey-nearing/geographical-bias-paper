[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geographical-bias-paper"
version = "1.0.0"
description = "Global Flood Warning Gaps Reflect Forecasting and Observational Blockers Beyond Local Gauge Sparsity"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  {name = "Grey Nearing"},
  {name = "Stephanie Rees"},
  {name = "Martin Gauch"},
  {name = "Justin Ginnetti"},
  {name = "Juliet Rothenberg"},
]
dependencies = [
  "absl-py>=2.0.0",
  "geopandas>=0.14.0",
  "lightgbm>=4.0.0",
  "matplotlib>=3.8.0",
  "netCDF4>=1.6.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
  "rasterio>=1.3.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.11.0",
  "seaborn>=0.13.0",
  "shap>=0.44.0",
  "shapely>=2.0.0",
  "tqdm>=4.66.0",
  "xarray>=2023.10.0",
  "xgboost>=2.0.0",
  "zarr>=2.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "hydro_metrics*"]
